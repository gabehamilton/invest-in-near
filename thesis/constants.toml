# Declared constants: inputs that no API returns. Each has a source, a verbatim quote and a retrieval date.
# Rendered on data.html via <span class="rule">; never typed into prose.

[treasury_share]
value = 0.1
unit = "ratio"
source = "https://github.com/near/nearcore/blob/71fd3bc6921936d861c894a19fb781446ed959f7/chain/epoch-manager/src/reward_calculator.rs"
quote = "let protocol_reward_rate = if use_hardcoded_value { Rational32::new_raw(1, 10) } ..."
note = "Mainnet hard-codes the treasury share to 1/10; the RPC field protocol_reward_rate reads [0,1]. Stakers receive 0.9 of each epoch's mint."
retrieved = "2026-11-10"

[unlock_epochs]
lo = 3
hi = 4
unit = "count"
source = "https://github.com/near/core-contracts/blob/1b0436c96379c63aee7d2429c6d5d24019031ab8/staking-pool/src/lib.rs"
quote = "const NUM_EPOCHS_TO_UNLOCK: EpochHeight = 4; // The actual number of epochs when the funds are unlocked is 3"
