[mmf_penny_band]
value = 0.5
unit = "%"
source = "https://www.ecfr.gov/current/title-17/section-270.2a-7"
paragraph = "(a)(19)"
quote = "Penny-rounding method of pricing means the method of computing an investment company's price per share for purposes of distribution, redemption and repurchase whereby the current net asset value per share is rounded to the nearest one percent."
paragraph_band = "(g)(1)(i)(B)"
quote_band = "In the event such deviation from the money market fund's amortized cost price per share exceeds 1/2 of 1 percent, the board of directors shall promptly consider what action, if any, should be initiated by the board of directors."
verified_against = "https://www.ecfr.gov/api/versioner/v1/full/2026-11-01/title-17.xml?part=270&section=270.2a-7 (eCFR text as of 2026-11-01)"
note = "Rounding to the nearest cent of a $1.00 share keeps the price at $1.00 while NAV stays within half a cent (0.5%) of it; the amortized-cost procedures in (g)(1)(i)(B) use the same half-percent deviation trigger."
retrieved = "2026-11-10"

[sweep_definition]
unit = "text"
source = "https://www.ecfr.gov/current/title-17/section-240.15c3-3"
quote = "The term Sweep Program means a service provided by a broker or dealer where it offers to its customer the option to automatically transfer free credit balances in the securities account of the customer to either a money market mutual fund product as described in § 270.2a-7 of this chapter or an account at a bank whose deposits are insured by the Federal Deposit Insurance Corporation."
retrieved = "2026-11-10"

