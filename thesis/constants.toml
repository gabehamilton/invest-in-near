[intents_confidential_from]
value = "2026-10-27"
unit = "date"
source = "https://docs.near-intents.org/changelog/entries/2026-10-27-1click-confidential.md"
quote = "From October 27, 2026, 1Click swaps settle confidentially."
verified_against = "https://docs.near-intents.org/changelog/entries/2026-10-27-1click-confidential.md (entry text, re-read 2026-11-10)"
note = "From this date 1Click swaps settle confidentially on the NEAR Private Shard; c06 annotates the month."
retrieved = "2026-11-10"

[rectify_inflation_protocol]
value = 45
unit = "count"
source = "https://github.com/near/nearcore/blob/09b978c15a170a1082eabe9f275030a9e5b27382/core/primitives/src/version.rs"
quote = "ProtocolFeature::RectifyInflation => 45,"
source_reward = "https://github.com/near/nearcore/blob/09b978c15a170a1082eabe9f275030a9e5b27382/chain/epoch_manager/src/reward_calculator.rs"
quote_reward = "if checked_feature!(\"stable\", RectifyInflation, protocol_version) { (U256::from(*max_inflation_rate.numer() as u64) * U256::from(total_supply) * U256::from(epoch_duration) / (U256::from(self.num_seconds_per_year) ..."
verified_against = "nearcore tag 1.20.0 (commit 09b978c15a170a1082eabe9f275030a9e5b27382), both files re-read 2026-11-10"
note = "From this protocol version an epoch's reward is max_inflation_rate x total supply x epoch duration / seconds per year, so each epoch's annualized mint in rpc/epoch_history.csv can be compared with max_inflation_rate (the c02 realized-mint check). Before it, the reward was computed from block counts."
retrieved = "2026-11-10"

# The desk simulation's scenario: chosen values, not facts any source reports. Each is labelled on the
# page ("Scenario", "Benchmark", "Assumption") and read by pipeline/models/portfolio.py only.
[desk_scenario]
kind = "author scenario"
unit = "text"
quote = "Once we have the thesis and its evidence, telling the story of the thesis in the UI is the main effort. That story should end with an interactive portfolio simulation. It should show the expected benefits over the coming year to a $500M trading desk of holding undeployed funds in a mixture of the dollars, euros, and NEAR as opposed to a just dollars and euros."
note = "The desk simulation's scenario: the desk size, the NEAR share rule and slider range, the fallback dollar share, the exit participation rate and the range of the own price assumption. None is measured."
retrieved = "2026-11-12"

[desk_scenario.size]
value = 500000000
unit = "USD"
note = "The desk's idle money, from the request above. Fixed: the page does not let a reader change it."

[desk_scenario.share]
step_bp = 10
max_bp = 1000
default_step_bp = 10
grid_bp = [100, 200, 500, 1000]
unit = "bp"
note = "The NEAR share slider moves in steps of step_bp up to max_bp. The default share is the interest-budget share (the largest share whose bad-year average loss fits inside one year of the whole desk's interest) floored to default_step_bp. grid_bp are the shares in the table the page shows without JavaScript."

[desk_scenario.split]
value = 0.75
step_pct = 1
unit = "ratio"
note = "The dollar share of the cash part. Used only when the BIS turnover figures (fx_usd_turnover, fx_eur_turnover) are absent; otherwise the split is their ratio rounded to step_pct, labelled a benchmark proxy (trading volume, not holdings)."

[desk_scenario.participation]
value = 0.10
unit = "ratio"
note = "The share of a median day's exchange volume the desk would be one of the sellers in. An assumption, always printed beside the days at the whole day's volume."

[desk_scenario.mu_bounds]
lo = -90
hi = 200
unit = "%"
note = "The range of the reader's own one-year NEAR price change; wide enough to hold the median break-even of both windows, and above minus one hundred."
