# Known gaps and UNVERIFIED items, rendered on index.html (limits), data.html (known gaps) and THESIS.md.
#
# Schema: one [[items]] table per item.
#   id       stable slug, used as the HTML anchor (gap-<id>)
#   title    short label
#   status   one of: unverified, not measured, not checkable, open, stale, depends on BigQuery
#   text     what we know and why it matters
#   resolve  what would close the item
#   refs     identifiers shown verbatim through ident() (proposal numbers and the like)
#   affects  claim and chart ids this item touches, shown through ident()
#   links    [{label, href}] rendered through cite()
#   resolved_if / resolved_status  a registry key; when it is non-null, the item's status becomes
#            resolved_status (default "partly resolved")
# Prose fields (title, text, resolve, link labels) never contain a digit. They may use {key}
# placeholders for registry keys; text() turns those into numbers with provenance.

[[items]]
id = "slashing"
title = "Slashing"
status = "unverified"
refs = []
affects = ["H6", "c14"]
text = "As far as I can tell NEAR does not slash validator stake today, but I have not confirmed it in the protocol spec or the nearcore source. If slashing exists, liquid staking carries a loss path that none of the yield figures include."
resolve = "Cite the nearcore code path or the Nomicon section that governs slashing, pinned to a commit."
links = [{ label = "Nomicon, the NEAR protocol specification", href = "https://nomicon.io/" }]

