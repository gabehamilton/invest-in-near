# Verdict rules: every threshold the site applies lives here and nowhere else.
#
# Read by pipeline/models/verdicts.py (claims, tripwires) and pipeline/build.py (cross-checks).
# Pages print these rules only through rule(id, field), inside <span class="rule">.
#
# Claim tables (one per claim, in ledger order). Fields:
#   kind           stated | hidden (assumption hiding in the hypothesis) | reframe
#   title          short label
#   claimed        verbatim fragment of [meta].hypothesis or [meta].thesis (the sentence a hidden assumption hides in)
#   assumption     kind = "hidden" only: the assumption in one line
#   test           the test in one line
#   metrics        registry keys shown with the verdict
#   requires       keys that must be non-null, else Not computed (default: metrics)
#   not_computed_if / not_computed_reason   extra Not computed condition (evaluated first)
#   untestable_if / untestable_reason / trigger   Not testable condition and what would make it testable
#   supported / partly / refuted   expressions over registry keys
#   chart / charts / section   where the evidence is shown
#
# Expressions: comparisons (< <= > >= == !=), and / or / not, + - * /, abs(), numbers, quoted strings
# (text keys only, == and !=), registry keys. Parsed by an ast whitelist, never eval.
# Evaluation per claim: a required key is null -> Not computed (with its null_reason); not_computed_if
# -> Not computed; untestable_if -> Not testable; supported -> Supported; refuted -> Refuted; partly
# (if given) -> Partly; with no partly expression, Partly. A key that is null inside an expression
# makes it unknown; an unknown decisive expression gives Not computed, never a guess.

[meta]
hypothesis = "NEAR is deflationary compared to other currencies. Compared to the US dollar, NEAR's inflation rate of 2.5% is approximately 1.5% lower. Current staking rewards of 4.13% are approximately 0.25% higher than the effective federal funds rate of 3.88%. Though both the inflation rate and fed rate change, they stay in balance over time. Other currencies have a wider spread. This makes NEAR ideal for sweep funds and other currency storage. In addition, NEAR is volatile. Rather than being a disadvantage this is an asset, volatility can be sold."
tally_note = "The tally counts the stated claims and the hidden assumption (ids starting with H). H6_near reframes H6 and sits beside it, outside the count. Not testable and Not computed are listed on their own and never folded into supported or refuted."
thesis = "NEAR is deflationary relative to the dollar and other currencies."
boundaries = "Past and future governance conditions are not relevant, if the conditions change investors can move elsewhere with plenty of notice. Similarly, past performance and market conditions are only useful in so far as they are indicative of near term behavior. Future investors don't own NEAR yet so don't care about where it is relative to the peak (which would be a sunk cost anyway). In other words we are concerned with the current macro-economic environment and NEAR's current utility."

# ---------------------------------------------------------------- stated claims

[H1]
kind = "stated"
title = "NEAR's supply grows slower than major currencies' money"
claimed = "NEAR is deflationary compared to other currencies."
test = "Over the latest year of each (NEAR's supply to the latest chain sample, each currency's money to its latest month), did NEAR's supply grow slower than US broad money and than the median broad-money growth of the most-traded currencies?"
metrics = ["gap_m2", "h1_gap_med", "h1_n_faster", "n_fiat_money", "m2_yoy", "g_365"]
requires = ["gap_m2", "h1_gap_med", "n_fiat_money"]
not_computed_if = "n_fiat_money < 7"
not_computed_reason = "fewer than seven of the panel's most-traded currencies have a latest money-growth reading"
supported = "gap_m2 > 0 and h1_gap_med > 0"
refuted = "gap_m2 <= 0"
chart = "c21"
charts = ["c21", "c11"]
section = "A1"

[H2]
kind = "stated"
title = "Since the issuance ceiling cut, NEAR's supply has grown slower than US prices"
claimed = "NEAR is deflationary relative to the dollar"
test = "From the first month after the issuance ceiling cut that US CPI-U can match to the latest CPI month, did NEAR's supply grow slower than US consumer prices, both annualized over the same months?"
metrics = ["h2_gap", "h2_near_g", "h2_cpi", "h2_from", "h2_to", "h2_months_slower", "h2_months_read", "cut_date"]
requires = ["h2_gap"]
supported = "h2_gap > 0"
refuted = "h2_gap < 0"
chart = "c23"
charts = ["c23"]
section = "A1"

[H3]
kind = "stated"
title = "Staking pays about 0.25 pp more than fed funds"
claimed = "Current staking rewards of 4.13% are approximately 0.25% higher than the effective federal funds rate of 3.88%."
test = "Over the last 365 days, did liquid-staking yield beat compounded fed funds by more than zero and at most 1 pp (like for like)?"
metrics = ["spread_adj_365", "y_lst_365", "ffcomp_365", "spread_naive_365", "effr_mean_365"]
requires = ["spread_adj_365"]
supported = "spread_adj_365 > 0 and spread_adj_365 <= 1.0"
partly = "spread_adj_365 > 1.0"
refuted = "spread_adj_365 <= 0"
chart = "c01"
charts = ["c01"]
section = "A2"

[H4]
kind = "stated"
title = "NEAR's supply-and-staking edge over the dollar holds as rates move"
claimed = "Though both the inflation rate and fed rate change, they stay in balance over time."
test = "NEAR's edge over the dollar is US CPI-U inflation minus NEAR's supply growth, plus liquid-staking yield minus compounded fed funds, each over the same trailing year, read every month, in years ending before and after the issuance ceiling cut; NEAR's dollar price is not part of it. Was it at or below zero in no more than 40% of the months?"
metrics = ["adv_share_le0", "adv_months_le0", "adv_months", "adv_months_before", "adv_months_after", "adv_mean_before", "adv_mean_after", "adv_years", "adv_months_clean_after"]
requires = ["adv_share_le0", "adv_months_before", "adv_months_after"]
not_computed_if = "adv_months_before < 1 or adv_months_after < 1"
not_computed_reason = "one side of the issuance ceiling cut has no month with every input"
supported = "adv_share_le0 <= 40"
refuted = "adv_share_le0 > 40"
chart = "c24"
charts = ["c24"]
section = "A2"

[H5]
kind = "stated"
title = "Other currencies have a wider spread"
claimed = "Other currencies have a wider spread."
test = "On both fixed readings of 'spread', is NEAR's latest spread narrower than the latest median of the panel's economies?"
metrics = ["h5_now_narrower", "h5_now_wider", "near_reading_a", "near_reading_b", "panel_median_abs_a", "panel_median_abs_b", "n_panel"]
requires = ["h5_now_narrower", "h5_now_wider"]
supported = "h5_now_narrower == 2 and h5_now_wider == 0"
refuted = "h5_now_wider == 2"
chart = "c13"
charts = ["c13"]
section = "A3"

[H6]
kind = "stated"
title = "NEAR is ideal for sweep funds (as a dollar vehicle)"
claimed = "This makes NEAR ideal for sweep funds and other currency storage."
test = "Does staked NEAR pass every row of the sweep-account checklist as a US dollar vehicle?"
metrics = ["h6_rows_passed", "h6_rows_total", "h6_critical_failed"]
supported = "h6_rows_total > 0 and h6_rows_passed == h6_rows_total and h6_critical_failed == 0"
refuted = "h6_critical_failed >= 1"
chart = "c14"
charts = ["c14"]
section = "A4"

[H7]
kind = "stated"
title = "NEAR is volatile"
claimed = "In addition, NEAR is volatile."
test = "Is NEAR's realized volatility at least 50% a year over the last 365 days and over the last 90 days?"
metrics = ["rv_365_near", "rv_90_near", "rv_365_btc"]
requires = ["rv_365_near", "rv_90_near"]
supported = "rv_365_near >= 50 and rv_90_near >= 50"
refuted = "rv_365_near < 25"
chart = "c08"
charts = ["c08", "c09"]
section = "O5"

[H8]
kind = "stated"
title = "NEAR's volatility can be sold"
claimed = "Rather than being a disadvantage this is an asset, volatility can be sold."
test = "No options venue I could check lists NEAR, so the test sells NEAR's swings on a perpetual: keep the NEAR staked, sell 10% of the stake short at the daily close after each 10% rise, at most 5 times, and buy each slice back after a 10% fall. Over every one-year window with full data, did this ladder end ahead of a short of 25% of the stake held all year with the same dollars on the venue, after funding, fees, slippage, interest and any liquidation? Supported if its average lead stays above zero in at least 97.5% of 1,000 histories redrawn from blocks of 30 of NEAR's own days and centred on the real result, on both Hyperliquid and Binance; refuted if in 2.5% or fewer on both."
metrics = ["vol_perp_hl_swing_share", "vol_perp_bn_swing_share", "vol_perp_hl_swing", "vol_perp_bn_swing", "vol_perp_hl_funding_year", "vol_perp_hl_windows", "vol_perp_bn_windows", "vol_perp_hl_years", "n_venues_with_near_options", "n_option_venues_checked"]
requires = ["vol_perp_hl_swing_share", "vol_perp_bn_swing_share", "vol_perp_hl_years", "vol_perp_bn_years"]
not_computed_if = "vol_perp_hl_years < 3 or vol_perp_bn_years < 3"
not_computed_reason = "the one-year windows with funding on a venue span fewer than three separate years"
supported = "vol_perp_hl_swing_share >= 97.5 and vol_perp_bn_swing_share >= 97.5"
refuted = "vol_perp_hl_swing_share <= 2.5 and vol_perp_bn_swing_share <= 2.5"
chart = "c26"
charts = ["c26", "c15"]
section = "A5"

[H10]
kind = "stated"
title = "Patient holders can capture NEAR's volatility"
claimed = "Rather than being a disadvantage this is an asset"
test = "Three strategies, over every one-year window with full data: sell at the next close after NEAR first closes 25% above cost (else at the year's end); rebalance to the desk's NEAR share every 30 days; or run the ladder of short sales on a NEAR perpetual. Did any beat holding by more than it did on 1,000 histories of NEAR's own daily moves shuffled in blocks of 30 days? A strategy beats chance when it beats at least 97.5% of those histories and loses to chance when it beats 2.5% or fewer. The ladder counts only when Hyperliquid and Binance, the longer record, agree."
metrics = ["vol_rally_rank", "vol_rebal_rank", "vol_perp_hl_rank", "vol_perp_bn_rank", "vol_rally_excess", "vol_rebal_excess", "vol_perp_hl_excess", "vol_perp_bn_excess", "vol_windows", "vol_years", "vol_first_start", "vol_last_end"]
requires = ["vol_rally_rank", "vol_rebal_rank", "vol_perp_hl_rank", "vol_perp_bn_rank", "vol_years", "vol_perp_hl_years", "vol_perp_bn_years"]
not_computed_if = "vol_years < 3 or vol_perp_hl_years < 3 or vol_perp_bn_years < 3"
not_computed_reason = "the one-year windows with every input span fewer than three separate years"
supported = "(vol_rally_rank >= 97.5 or vol_rebal_rank >= 97.5 or (vol_perp_hl_rank >= 97.5 and vol_perp_bn_rank >= 97.5)) and vol_rally_rank > 2.5 and vol_rebal_rank > 2.5 and (vol_perp_hl_rank > 2.5 or vol_perp_bn_rank > 2.5)"
refuted = "(vol_rally_rank <= 2.5 or vol_rebal_rank <= 2.5 or (vol_perp_hl_rank <= 2.5 and vol_perp_bn_rank <= 2.5)) and vol_rally_rank < 97.5 and vol_rebal_rank < 97.5 and (vol_perp_hl_rank < 97.5 or vol_perp_bn_rank < 97.5)"
chart = "c25"
charts = ["c25"]
section = "A5"

# ---------------------------------------------------------------- the hidden assumption

[H9]
kind = "hidden"
title = "A NEAR yield is comparable to a dollar yield"
assumption = "A yield paid in NEAR can be compared with a yield paid in dollars."
claimed = "Current staking rewards of 4.13% are approximately 0.25% higher than the effective federal funds rate of 3.88%."
test = "In what share of the weekly one-year windows that end within the last 365 days did a dollar held in staked NEAR land within 2 pp of fed funds?"
metrics = ["pct_within_2pp_1y", "n_windows_usd_1y"]
requires = ["pct_within_2pp_1y", "n_windows_usd_1y"]
not_computed_if = "n_windows_usd_1y < 26"
not_computed_reason = "fewer than 26 weekly one-year windows end within the last year"
supported = "pct_within_2pp_1y >= 50"
partly = "pct_within_2pp_1y >= 20"
refuted = "pct_within_2pp_1y < 20"
chart = "c07"
charts = ["c07"]
section = "O5"

# ---------------------------------------------------------------- reframe

[H6_near]
kind = "reframe"
title = "Staked NEAR as storage for balances already held in NEAR"
claimed = "This makes NEAR ideal for sweep funds and other currency storage."
test = "For balances already in NEAR: do the principal-stability and yield rows pass, with same-day liquidity not failing?"
metrics = ["h6n_rows13_pass", "h6n_row2_fail"]
supported = "h6n_rows13_pass == 2 and h6n_row2_fail == 0"
refuted = "h6n_rows13_pass == 0"
chart = "c14"
charts = ["c14"]
section = "A4"

# ---------------------------------------------------------------- tripwires (what would change my mind)

[tripwires.T1]
group = "break"          # break: part of the thesis fails; confirm: the thesis gains ground
metric = "g_365"
metric_label = "NEAR supply growth over the last year"
keys = ["g_365", "i_max_now"]
threshold_text = "more than 0.5 pp above the issuance ceiling in force"
expr = "g_365 > i_max_now + 0.5"
meaning = "Supply growth breaks from the protocol ceiling that keeps it below money growth (H1) and US prices (H2)."
chart = "c02"

[tripwires.T2]
group = "break"
metric = "staker_share_365"
metric_label = "Change in stakers' share of supply over the last year"
keys = ["staker_share_365"]
threshold_text = "at or below zero"
expr = "staker_share_365 <= 0"
meaning = "Stakers lose share of supply: staking no longer keeps a holder ahead of new issuance."
chart = "c03"

[tripwires.T3]
group = "confirm"
metric = "burn_share_365"
metric_label = "Fees burned as a share of issuance over the last year"
keys = ["burn_share_365"]
threshold_text = "25% or more of issuance"
expr = "burn_share_365 >= 25"
meaning = "Fees burned start to offset a real share of issuance."
chart = "c05"

[tripwires.T4]
group = "confirm"
metric = "burn_share_365"
metric_label = "Fees burned as a share of issuance over the last year"
keys = ["burn_share_365"]
threshold_text = "100% or more of issuance"
expr = "burn_share_365 >= 100"
meaning = "Fee burn exceeds new issuance, so total supply shrinks."
chart = "c05"

[tripwires.T5]
group = "break"
metric = "intents_vol_90d_seq_ratio"
metric_label = "NEAR Intents volume, latest ninety days against the ninety before"
keys = ["intents_vol_90d_seq_ratio"]
threshold_text = "below 0.5 times the previous ninety days"
expr = "intents_vol_90d_seq_ratio < 0.5"
meaning = "Demand for the network, which the supply comparison leaves out, is shrinking."
chart = "c06"

[tripwires.T6]
group = "break"
metric = "s_now"
metric_label = "Share of NEAR supply staked"
keys = ["s_now", "y_s60"]
threshold_text = "staked share above 60%"
expr = "s_now > 60"
meaning = "The staking yield compresses toward the cell for that staked share in c10."
chart = "c10"

[tripwires.T7]
group = "break"
metric = "spread_adj_90"
metric_label = "Staking yield minus fed funds over the last ninety days"
keys = ["spread_adj_90"]
threshold_text = "below zero"
expr = "spread_adj_90 < 0"
meaning = "H3 flips: staking pays less than fed funds."
chart = "c01"

[tripwires.T8]
group = "confirm"
metric = "n_venues_with_near_options"
metric_label = "Venues listing NEAR options"
keys = ["n_venues_with_near_options"]
threshold_text = "one venue or more lists NEAR options"
expr = "n_venues_with_near_options >= 1"
meaning = "A NEAR options market opens, so NEAR's volatility could be sold for a premium rather than only through a perpetual."
chart = "c15"

# ---------------------------------------------------------------- model parameters
# Author-chosen thresholds and scenario inputs the models use. They are not external facts (those live in
# thesis/constants.toml with a source and a quote). Read by pipeline/models/params.py. Every parameter that also
# appears as a literal in a rule above is pinned to that literal by tests/test_params.py, so a rule and the model
# that feeds it cannot drift apart. Changing one means changing both.

[params]
adv_le0_max_pct = 40      # H4: refuted when NEAR's advantage over the dollar is at or below zero in more than this share of months
vol_horizon_days = 365    # H10: each window is one year, the wait a long-term holder is asked to accept
vol_rally_pct = 25        # H10 selling into rallies: sell at the first close this far above cost, a round level between a small move and a doubling
vol_rally_ladder = [10, 25, 50, 100]   # data page only: the same strategy at other levels, so no single level carries the result; no rule reads it
vol_rebal_days = 30       # H10 rebalancing: back to the desk's NEAR share every this many days, about monthly
vol_min_years = 3         # H8, H10 are not computed when the one-year windows span fewer than this many separate years
vol_null_block_days = 30  # H10 shuffled and H8 redrawn histories: NEAR's daily moves are cut into blocks this long, so a month of clustered moves stays together
vol_null_draws = 1000     # H10 shuffled and H8 redrawn histories per build; enough that a rank or a share moves by a tenth of a point per history
vol_rank_hi = 97.5        # H10: a strategy beats chance when it beats at least this share of the shuffled histories; H8: supported when the ladder's lead stays above zero in at least this share of the redrawn histories (two-sided five percent)
vol_rank_lo = 2.5         # H10: a strategy loses to chance when it beats this share of the shuffled histories or fewer; H8: refuted at this share of the redrawn histories or fewer (the mirror of vol_rank_hi)
vol_perp_rung_pct = 10        # H8, H10 perp ladder: a slice is sold short after each rise this large and bought back after each fall this large; about two ordinary NEAR days, and the smallest level of the rally ladder
vol_perp_slice_pct = 10       # perp ladder: the share of the starting stake sold short per rung, small enough that one trade is not a decision
vol_perp_rungs = 5            # perp ladder: the most slices short at once, so at least half the stake always keeps NEAR's price
vol_perp_static_pct = 25      # H8: the short that never trades, this share of the stake held all year; half the ladder's most (vol_perp_rungs x vol_perp_slice_pct / 2), fixed before a window starts
vol_perp_fee_pct = 0.045      # perp ladder: fee on every trade, Hyperliquid's published base taker fee, applied to both venues
vol_perp_slip_pct = 0.10      # perp ladder: every trade fills this far against the holder
vol_perp_maint_pct = 5        # perp ladder: the venue closes a short whose equity falls below this share of its value (Hyperliquid: half the initial margin at the NEAR perpetual's maximum leverage)
vol_perp_collateral = 1.0     # perp ladder: dollars kept on the venue per dollar of the most the ladder can be short, because staked NEAR cannot be posted there
vol_perp_topup_at = 0.8       # perp ladder: send dollars when the venue's equity falls below this share of the collateral target
vol_perp_sweep_at = 1.25      # perp ladder: bring dollars home when the venue's equity exceeds this multiple of the target
vol_perp_transfer_days = 3    # perp ladder: days a transfer to or from the venue takes
vol_perp_sens_rate_add = [3, 6]          # data page only: the perp ladder with dollars costing fed funds plus these points a year; no rule reads it
vol_perp_sens_collateral = [0.75, 0.5]   # data page only: the ladder with these multiples of the collateral target; no rule reads it
vol_perp_sens_transfer_days = [1, 7]     # data page only: transfers taking these many days; no rule reads it
vol_perp_sens_slip_pct = [0.30, 0.50]    # data page only: every trade filling this far against the holder; no rule reads it
vol_perp_sens_lag_days = 1               # data page only: decide at a close, fill this many closes later; no rule reads it
within_pp = 2.0           # H9: a window counts toward pct_within_2pp_1y when |ret - cash| <= within_pp
sweep_majority = 0.5      # c14 row 3: partial when at least this share of windows beat the benchmark
s_hypo = 0.60             # c10: the hypothetical staked share (a fraction); tripwire T6 fires above it
t3_burn_pct = 25          # tripwire T3's burn share of issuance; burn_needed_t3 is this share of mint_per_day_365
# the desk simulation (pipeline/models/portfolio.py and its browser twin site/assets/sim.js)
sim_seed = 20261109       # xoshiro128** seed (through splitmix32); the browser replays the same stream
sim_paths = 20000         # simulated years; a multiple of 200 so each of the hundred dots is one sorted year
sim_horizon_days = 365    # days drawn per simulated year
sim_windows = [365, 90]   # the calendar-day windows whose daily moves are resampled; the first is the default
sim_block_days = 7        # c33 sensitivity row only: runs of whole days resampled together
sim_mu_default = 0.0      # the default NEAR price assumption: flat on average
sim_half = 0.5            # a simulated year counts as "halved at some point" when the price factor falls to this
sim_tail_lo = 0.05        # the worst-years quantile shown (type-7)
sim_tail_mid = 0.5        # the typical year
sim_tail_hi = 0.95        # the best-years quantile shown
sim_es_every = 20         # bad-year average: the mean of the worst sim_paths / sim_es_every years
sim_es_deep_every = 40    # the deeper tail on the data page: the worst sim_paths / sim_es_deep_every years
sim_dots = 100            # dots in the plot (each the middle year of its hundredth)
sim_seed_checks = [1, 2, 3, 4, 5]   # five other seeds: their spread sets the precision of every simulated figure
sim_usd_step_exact = 10000   # closed-form dollar figures round to this many dollars
sim_usd_step_edge = 10    # the resets' change to the expected value rounds to this many dollars
# simulated figures round to the first step above their spread across the seeds (scaled to the NEAR part), so a
# different seed cannot move a printed figure by a whole step
sim_steps_usd = [10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000, 5000000, 10000000, 20000000, 50000000]
sim_steps_pp = [1, 2, 5, 10, 20, 50]
sim_steps_count = [1, 5, 10]
sim_day_var = 0.99        # one-day value at risk level, from the raw daily moves of each window
sim_day_es = 0.975        # one-day expected shortfall level

