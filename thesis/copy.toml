text = "The treasury account's balance dropped sharply in one quarter this year, and I could not find a published reason. It does not change supply growth, but it matters for sell pressure."

[disclosure]
[[disclosure.variants]]
when = []
text = "Built with AI assistance: Claude Code wrote the code and the prose, and I directed it. Every number comes from public data and links to its formula."

[agent_heading]
[[agent_heading.variants]]
when = []
text = "Test your own thesis against this one"

[agent_intro]
[[agent_intro.variants]]
when = []
text = "You have read my thesis and the evidence for it. Yours is the other half. Hand the published thesis to an AI agent you already use, tell the agent yours, and have it set the two side by side: where you agree, where the evidence cuts against you, and where neither of us has tested the point."

[agent_privacy]
[[agent_privacy.variants]]
when = []
text = "This page never sees your thesis. The buttons copy text to your clipboard and you paste it into the agent you pick. The only request the page makes is to fetch its own THESIS.md."

[agent_nearai_tag]
[[agent_nearai_tag.variants]]
when = []
text = "Confidential, recommended"

[agent_nearai_text]
[[agent_nearai_text.variants]]
when = []
text = "Your thesis is the private part, so start here. NEAR AI runs its models inside hardware-sealed enclaves and says its own staff cannot read your chats; this site has not verified that claim. Sign in with your NEAR AI account, open a new chat and paste. Copy attaches the full text of THESIS.md ahead of the prompt, because this chat may not be able to open links."

[agent_chatgpt_text]
[[agent_chatgpt_text.variants]]
when = []
text = "Browses the web, so the prompt alone is enough. Your thesis goes to OpenAI under its data policy; use a temporary chat if you do not want the conversation kept."

[agent_claude_text]
[[agent_claude_text.variants]]
when = []
text = "Browses the web when web search is on, so the prompt alone is enough. Your thesis goes to Anthropic under its data policy; use an incognito chat if you do not want the conversation kept."

[agent_cli]
[[agent_cli.variants]]
when = []
text = "Prefer a terminal, and want the confidentiality checked rather than promised? Clone the repo and run the command below with a NEAR AI Cloud API key. It sends your thesis to a model in NEAR AI's enclave from your own machine, and before it sends a word it checks the enclave's Intel hardware attestation, then checks the signature on the reply. Any failed check stops the run."

[agent_check]
[[agent_check.variants]]
when = []
text = "Check the agent the way you would check me. Every figure it quotes should carry a registry key. Look that key up in numbers.json, or hover the same figure on this page, to see its formula and inputs. A figure with no key is the agent's own, not the site's."

[agent_prompt]
[[agent_prompt.variants]]
when = []
text = """I want to stress-test my own investment thesis against a published one, "NEAR, tested", at SITE/. Read it from the source. Do not answer from memory.

Fetch these:
- SITE/THESIS.md: the argument in plain text, with a verdict for every claim
- SITE/data/verdicts.json: each verdict and the rule that decided it
- SITE/data/numbers.json: every figure, with its formula, inputs and source files
- SITE/data/tripwires.json: what would flip the thesis
- SITE/llms.txt: an index of everything else (charts, sources, cross-checks)
If you cannot open links, work from the THESIS.md text pasted above this message, if there is any, and tell me which files you could not read.

Ground rules:
- Use figures only from those files and name the registry key beside each one. If a figure is not there, say so. Do not estimate it.
- Keep tested and untested apart. The site tests claims against public on-chain and macro data. Say which of my assumptions it never touched.
- Scope is the current macro environment and NEAR's current utility. Past price is an indicator of near-term behavior, not a reason to buy or sell. Governance is left out.
- Say plainly where the site's verdicts hurt my thesis and where they do not.

Then work in this order:
- First, ask me for my thesis, one question at a time: what I hold or plan to hold, over what horizon, what I expect from rates and inflation, and what would make me wrong. If I pasted it below, restate it in your own words and let me correct you before going on.
- Second, set each of my assumptions beside the site's claims: where we agree, where we conflict, and where neither side has tested it.
- Third, run the site's tripwires against my thesis: which ones would break mine, and which tripwires mine needs that the site lacks.
- Last, give me the questions or data that would settle our biggest disagreement. Do not tell me to buy or sell. This is analysis, not advice.

My thesis (paste it here, or leave this blank and interview me):
"""

