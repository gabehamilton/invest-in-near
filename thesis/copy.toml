# ---------------------------------------------------------------- objections

[objections_intro]
[[objections_intro.variants]]
when = []
text = "These are the objections I would raise if someone else pitched me this hypothesis. Each gets a straight answer and the chart that decides it."

[O1_heading]
[[O1_heading.variants]]
when = []
text = "“Deflationary? Supply goes up every epoch.”"

[O1_stance]
[[O1_stance.variants]]
when = ["H1=Refuted", "T1=clear"]
text = "Conceded on the word, answered on discipline"
[[O1_stance.variants]]
when = ["H1=Refuted"]
text = "Conceded"
[[O1_stance.variants]]
when = []
text = "Tested below"

[O1_answer]
[[O1_answer.variants]]
when = ["H1=Refuted", "T1=clear"]
text = "Fair. NEAR's supply grows every epoch, so “deflationary” is the wrong word. The growth is small and it follows the protocol's ceiling: the {g_365} above, against a ceiling of {i_max_now}."
[[O1_answer.variants]]
when = ["H1=Refuted"]
text = "Fair. NEAR's supply grows every epoch, so “deflationary” is the wrong word. It grew {g_365} over the last year."
[[O1_answer.variants]]
when = []
text = "Supply growth over the last year: {g_365}. The verdicts below say what that means for the claim."

[O2_heading]
[[O2_heading.variants]]
when = []
text = "“Staking yield is just dilution. You're paying yourself.”"

[O2_stance]
[[O2_stance.variants]]
when = ["T2=clear"]
text = "Answered for stakers"
[[O2_stance.variants]]
when = []
text = "Tested below"

[O2_answer]
[[O2_answer.variants]]
when = ["T2=clear"]
text = "Only if everyone stakes. Staking pays more than new supply adds, so a liquid staker's share of all NEAR grew {staker_share_365} a year. The cost lands on unstaked holders, whose share changed by {nonstaker_365} a year."
[[O2_answer.variants]]
when = []
text = "A liquid staker's share of all NEAR changed by {staker_share_365} a year; an unstaked holder's changed by {nonstaker_365}."

[O3_heading]
[[O3_heading.variants]]
when = []
text = "“Then there's no real yield. Fees don't cover issuance.”"

[O3_stance]
[[O3_stance.variants]]
when = ["H10=Refuted"]
