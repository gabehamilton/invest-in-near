# Page prose for index.html and THESIS.md, selected by verdict.
#
# Schema: one [name] table per piece of prose, each with an array of variants.
# The first variant whose `when` conditions all hold wins. Conditions read "CLAIM=Verdict",
# where Verdict is one of: Supported, Partly, Refuted, Not testable, Not computed. A condition may also name a
# tripwire, cross-check, source or chart (its state) or a registry text key (its value, e.g.
# "burn_method_short=sampled", or "burn_method=exact: every epoch boundary" to tell the RPC exact method from
# BigQuery's).
# The last variant of every name has `when = []` and is the fallback. If nothing matches, the build fails.
#
# Text may contain {key} placeholders for registry keys and nothing else. Never type a digit in text:
# every figure comes from the registry through text(). Displays already carry their unit, so write
# "{g_365}" and never "{g_365}%"; USD displays already carry the dollar sign.
# An empty text means "omit this fragment" (templates skip it).

# ---------------------------------------------------------------- hero

[headline]
[[headline.variants]]
when = ["H1b=Supported", "H1=Refuted", "H6=Refuted"]
text = "Relative to the dollar and the major currencies, NEAR's supply grows more slowly. It is not deflationary in absolute terms, and it is not cash."
[[headline.variants]]
when = []
text = "I tested a monetary hypothesis about NEAR, claim by claim. Here is the ledger."

[lede]
# the hidden assumptions are H9, H10 and H12; when all of them fail the count reads "all", never "three of the three"
[[lede.variants]]
when = ["H1b=Supported", "H3=Supported", "H9=Refuted", "H10=Refuted", "H12=Refuted"]
text = "I split the hypothesis behind that sentence into claims and tested each one, and the assumptions hiding inside them, against public data on today's economy. Of the {n_decided_stated} stated claims I could test, {n_supported_stated} hold, {n_refuted_stated} fail and {n_partly_stated} land in between, and all {n_decided_hidden} hidden assumptions fail. Two pieces carry the thesis. NEAR's supply grows slower than the major currencies' money, by a median {h1b_gap_med}. Staking ran {spread_adj_365:abs} {spread_adj_365_dir} compounded fed funds over the past year. Thin, but there."
[[lede.variants]]
when = ["H1b=Supported", "H3=Supported"]
text = "I split the hypothesis behind that sentence into claims and tested each one, and the assumptions hiding inside them, against public data on today's economy. Of the {n_decided_stated} stated claims I could test, {n_supported_stated} hold, {n_refuted_stated} fail and {n_partly_stated} land in between; {n_refuted_hidden} of the {n_decided_hidden} hidden assumptions fail. Two pieces carry the thesis. NEAR's supply grows slower than the major currencies' money, by a median {h1b_gap_med}. Staking ran {spread_adj_365:abs} {spread_adj_365_dir} compounded fed funds over the past year. Thin, but there."
[[lede.variants]]
when = []
text = "I split the hypothesis behind that sentence into claims and tested each one, and the assumptions hiding inside them, against public data. Of the {n_decided_stated} stated claims I could test, {n_supported_stated} hold, {n_refuted_stated} fail and {n_partly_stated} land in between; {n_refuted_hidden} of the {n_decided_hidden} hidden assumptions fail. The ledger below gives every verdict with the rule that decided it."

[lede_h6]
[[lede_h6.variants]]
when = ["H1b=Supported", "H6=Refuted"]
text = "The claim that NEAR suits sweep balances fails its own test in the ledger below."
[[lede_h6.variants]]
when = []
text = ""

[scope_statement]
[[scope_statement.variants]]
when = []
text = "I judge NEAR the way someone deciding today whether to hold it would, on the economy as it is now. Governance is left out, past and future: if the rules change, holders hear about it well in advance and can sell. Past prices count where they say something about the coming year, so most tests use the latest year of data."

[hero_label]
[[hero_label.variants]]
when = []
text = "NEAR's net supply growth over the year to {latest_rpc_date}"

[hero_subline]
# T7 reads spread_adj_90; when that window has no LST samples at both edges, quote the full year instead
[[hero_subline.variants]]
when = ["T7=not computed"]
text = "In the year to {m2_month}: NEAR's supply {g_365_at_m2}, US money supply {m2_yoy} · median broad-money growth of the {n_fiat_money} most-traded currencies, each over its latest year, {fiat_gm_latest_med} · staking minus fed funds {spread_adj_365} over the last year"

[[hero_subline.variants]]
when = []
text = "In the year to {m2_month}: NEAR's supply {g_365_at_m2}, US money supply {m2_yoy} · median broad-money growth of the {n_fiat_money} most-traded currencies, each over its latest year, {fiat_gm_latest_med} · staking minus fed funds {spread_adj_90} over the last ninety days"

