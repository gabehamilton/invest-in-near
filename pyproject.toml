[project]
name = "invest-in-near"
version = "0.1.0"
description = "Evidence-first investment thesis for NEAR: raw data pulls, models and a static dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["pytest>=8"]
# make explore: Intel TDX quote verification and Ethereum-style signature recovery
explore = ["dcap-qvl>=0.7", "eth-account>=0.13"]

[tool.uv]
package = false
default-groups = ["dev", "explore"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
